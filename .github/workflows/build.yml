name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.14.5

      - name: Detekt
        run: ./gradlew detekt --info --stacktrace 2>&1 | tail -100
        continue-on-error: true

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 7

      - name: Android Lint
        run: ./gradlew lint --info --stacktrace 2>&1 | tail -100
        continue-on-error: true

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint/
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew assembleDebug --info --stacktrace 2>&1

      - name: Print Gradle build results
        if: failure()
        run: |
          echo "=== Gradle build results ==="
          find /home/runner/work/_temp/.gradle-actions/build-results/ -name "*.json" \
            -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

      - name: Upload Gradle build results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-results
          path: /home/runner/work/_temp/.gradle-actions/build-results/*.json
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cull-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Decode keystore
        if: success()
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.p12

      - name: Build release APK
        if: success()
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/keystore.p12 \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cull-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
