name: Package Android SDK

on:
  workflow_dispatch:  # manual trigger only

jobs:
  package-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Check available SDK
        run: |
          echo "SDK root: $ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/
          echo "--- build-tools ---"
          ls $ANDROID_SDK_ROOT/build-tools/
          echo "--- platforms ---"
          ls $ANDROID_SDK_ROOT/platforms/

      - name: Package minimal SDK
        run: |
          mkdir -p /tmp/android-sdk-minimal

          # build-tools (needed: aapt2, d8, zipalign, apksigner)
          BT=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          echo "Using build-tools: $BT"
          cp -r $ANDROID_SDK_ROOT/build-tools/$BT /tmp/android-sdk-minimal/build-tools-$BT

          # platform android-35 (android.jar)
          cp -r $ANDROID_SDK_ROOT/platforms/android-35 /tmp/android-sdk-minimal/platform-android-35

          # Create tarballs
          cd /tmp
          tar -czf android-sdk-build-tools-$BT.tar.gz -C /tmp/android-sdk-minimal build-tools-$BT
          tar -czf android-sdk-platform-35.tar.gz -C /tmp/android-sdk-minimal platform-android-35

          echo "Sizes:"
          ls -lh /tmp/android-sdk-*.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-sdk-cache
          name: Android SDK Cache for local builds
          body: Minimal Android SDK components for local development builds
          files: |
            /tmp/android-sdk-build-tools-*.tar.gz
            /tmp/android-sdk-platform-35.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
